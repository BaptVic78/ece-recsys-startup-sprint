name: Docker image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: strideplan:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the image
        run: |
          docker run --rm strideplan:test python -m unittest discover -s tests
          docker run --rm strideplan:test python -m unittest discover -s strideplan_pipeline -p "test_*.py"
      - name: Check Compose and saved interactions
        env:
          STRIDEPLAN_IMAGE: strideplan:test
        run: |
          docker compose up -d --no-build --pull never --wait
          python scripts/check_docker.py
      - name: Stop the app
        if: always()
        run: docker compose down
      - name: Set image name
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag strideplan:test "$IMAGE:latest"
          docker tag strideplan:test "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
